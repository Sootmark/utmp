[package]
name = "sootmark-utmp"
version = "0.4.1"
edition = "2021"
rust-version = "1.80"
description = "Linux login records (utmp, wtmp, btmp, lastlog, wtmpdb, lastlog2): glibc's struct utmp and struct lastlog in their 32- and 64-bit-time layouts, either byte order, and the SQLite databases that replace them."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/utmp"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "linux", "wtmp"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "utmp"

[dependencies]
common = { package = "sootmark-common", version = "0.3.5" }
sqlite = { package = "sootmark-sqlite", version = "0.2.0" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
