[package]
name = "sootmark-utmp"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
description = "Linux login records (utmp, wtmp, btmp): glibc's struct utmp in its 384- and 400-byte layouts, either byte order."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/utmp"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "linux", "wtmp"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "utmp"

[dependencies]
common = { package = "sootmark-common", version = "0.3.5" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
